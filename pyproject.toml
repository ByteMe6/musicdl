[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "musicdl"
version = "1.0.0"
description = "Batch-download songs as fully tagged MP3s: Spotify metadata and cover art, best-match YouTube audio via yt-dlp."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "ByteMe6" }]
requires-python = ">=3.10"
dependencies = [
    "mutagen>=1.47",
    "requests>=2.31",
    "spotipy>=2.23",
    "yt-dlp>=2025.11.12",
]
keywords = ["music", "downloader", "spotify", "youtube", "yt-dlp", "mp3", "id3", "metadata", "cli"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Multimedia :: Sound/Audio",
    "Topic :: Multimedia :: Sound/Audio :: Conversion",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://github.com/ByteMe6/musicdl"
Issues = "https://github.com/ByteMe6/musicdl/issues"
Changelog = "https://github.com/ByteMe6/musicdl/blob/main/CHANGELOG.md"

[project.scripts]
musicdl = "musicdl:main"

[tool.setuptools]
py-modules = ["musicdl"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
