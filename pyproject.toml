[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "trackfetch"
version = "1.0.0"
description = "Turn a text file of songs into tagged MP3s: Spotify metadata and cover art, best-match YouTube audio via yt-dlp."
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "ByteMe6" }]
requires-python = ">=3.10"
dependencies = [
    "mutagen>=1.47",
    "requests>=2.31",
    "spotipy>=2.23",
    "yt-dlp>=2025.11.12",
]
keywords = ["music", "downloader", "spotify", "youtube", "yt-dlp", "mp3", "id3", "metadata", "cli"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Multimedia :: Sound/Audio",
    "Topic :: Multimedia :: Sound/Audio :: Conversion",
    "Topic :: Utilities",
]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-cov>=5"]

[project.urls]
Homepage = "https://github.com/ByteMe6/trackfetch"
Issues = "https://github.com/ByteMe6/trackfetch/issues"
Changelog = "https://github.com/ByteMe6/trackfetch/blob/master/CHANGELOG.md"

[project.scripts]
trackfetch = "trackfetch:main"

[tool.setuptools]
py-modules = ["trackfetch"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.coverage.report]
exclude_also = ['if __name__ == .__main__.:']

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
