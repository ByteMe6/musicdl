name: Bug report
description: Something doesn't download, match or tag correctly
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: input
    attributes:
      label: Input line(s)
      description: The `Artist - Title` lines that reproduce the problem.
      render: text
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Console output
      description: Paste the relevant musicdl output. Do **not** include your Spotify credentials.
      render: text
  - type: input
    id: versions
    attributes:
      label: Versions
      description: Output of `yt-dlp --version`, `ffmpeg -version | head -1` and `python --version`.
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options: [Linux, macOS, Windows, Other]
    validations:
      required: true
