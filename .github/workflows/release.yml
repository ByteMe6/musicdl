name: Build & Release

# Every push to master runs CI. A release is published only when the
# version in pyproject.toml has no matching vX.Y.Z tag yet.
#
# GITHUB_TOKEN may not create a tag on a commit that edits .github/workflows/,
# so bump the version in a commit that leaves workflow files untouched.
#
# PyPI uploads use trusted publishing and stay off until the PYPI_PUBLISH
# repository variable is "true". A version missing from PyPI is uploaded
# from its tag, so an existing release can be published there later.
on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
      tag: ${{ steps.check.outputs.tag }}
      release: ${{ steps.check.outputs.release }}
      pypi: ${{ steps.check.outputs.pypi }}
    steps:
      - uses: actions/checkout@v7
      - id: check
        name: Detect version change
        run: |
          version=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          tag="v$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null; then
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "::notice::$tag already released, skipping release"
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
            echo "::notice::New version $version, releasing $tag"
          fi
          if curl -sf -o /dev/null "https://pypi.org/pypi/trackfetch/$version/json"; then
            echo "pypi=false" >> "$GITHUB_OUTPUT"
          else
            echo "pypi=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: build (${{ matrix.asset }})
    needs: [ci, version]
    if: needs.version.outputs.release == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - { os: ubuntu-latest,    asset: trackfetch-linux-x86_64,         binary: dist/trackfetch }
          - { os: ubuntu-24.04-arm, asset: trackfetch-linux-arm64,          binary: dist/trackfetch }
          - { os: macos-latest,     asset: trackfetch-macos-arm64,          binary: dist/trackfetch }
          - { os: macos-15-intel,   asset: trackfetch-macos-x86_64,         binary: dist/trackfetch }
          - { os: windows-latest,   asset: trackfetch-windows-x86_64.exe,   binary: dist/trackfetch.exe }
          - { os: windows-11-arm,   asset: trackfetch-windows-arm64.exe,    binary: dist/trackfetch.exe }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt pyinstaller
      - name: Build
        run: pyinstaller trackfetch.spec
      - name: Smoke test
        run: ${{ matrix.binary }} --help
      - name: Rename binary
        shell: bash
        run: mv "${{ matrix.binary }}" "${{ matrix.asset }}"
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}
          if-no-files-found: error

  publish:
    needs: [version, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: assets
          merge-multiple: true
      - name: Checksums
        working-directory: assets
        run: sha256sum * > SHA256SUMS.txt
      - name: Release notes
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          # Changelog section for this version (between its "## [x.y.z]" header and the next one)
          awk -v v="$VERSION" '
            $0 ~ "^## \\[" v "\\]" { on = 1; next }
            on && /^## \[/ { exit }
            on && /^\[[^]]+\]: / { exit }
            on { print }
          ' CHANGELOG.md > notes.md
          cat >> notes.md <<'MD'

          ### Downloads

          | OS | x86_64 | ARM64 |
          | --- | --- | --- |
          | 🐧 Linux | `trackfetch-linux-x86_64` | `trackfetch-linux-arm64` |
          | 🍎 macOS | `trackfetch-macos-x86_64` | `trackfetch-macos-arm64` |
          | 🪟 Windows | `trackfetch-windows-x86_64.exe` | `trackfetch-windows-arm64.exe` |

          Verify with `SHA256SUMS.txt`. Binaries still need `yt-dlp`, `ffmpeg` and `deno` on your `PATH`, plus Spotify API credentials. See the [README](https://github.com/ByteMe6/trackfetch#install).

          Or install with a package manager:
          ```bash
          brew install ByteMe6/tap/trackfetch      # Homebrew, macOS and Linux
          pipx install trackfetch                  # PyPI
          nix profile install github:ByteMe6/trackfetch
          ```
          MD
          cat notes.md
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: ${{ needs.version.outputs.tag }} trackfetch
          body_path: notes.md
          make_latest: true
          files: assets/*

  pypi:
    name: publish to PyPI
    needs: [ci, version]
    if: needs.version.outputs.pypi == 'true' && vars.PYPI_PUBLISH == 'true'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/trackfetch/${{ needs.version.outputs.version }}/
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.version.outputs.release == 'true' && github.sha || needs.version.outputs.tag }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Build sdist and wheel
        run: |
          pip install build twine
          python -m build
          twine check --strict dist/*
      - uses: pypa/gh-action-pypi-publish@release/v1
